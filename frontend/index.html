<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>IB Central</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sidebar Navigation -->
  <nav id="sidebar">
    <div class="logo">
      <span class="logo-icon">🎓</span>
      <h1>IB Central</h1>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="nav-link active" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></li>
      <li><a href="#" class="nav-link" data-page="grades"><span class="nav-icon">📝</span> Grade Tracker</a></li>
      <li><a href="#" class="nav-link" data-page="assignments"><span class="nav-icon">📅</span> Assignments</a></li>
      <li><a href="#" class="nav-link" data-page="subjects"><span class="nav-icon">📚</span> Subjects Hub</a></li>
    </ul>
  </nav>

  <!-- Main Content Area -->
  <main id="content">
    <!-- Dashboard Page -->
    <section id="page-dashboard" class="page active">
      <h2 class="page-title">Dashboard</h2>
      <div class="score-card">
        <div class="score-ring-wrapper">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle class="ring-fg" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="326.73" />
          </svg>
          <div class="score-text">
            <span id="predicted-score">0</span>
            <span class="score-max">/ 45</span>
          </div>
        </div>
        <div class="score-label">Predicted DP Score</div>
      </div>
      <div id="dashboard-subjects" class="dashboard-grid"></div>
    </section>

    <!-- Grade Tracker Page -->
    <section id="page-grades" class="page">
      <div class="page-header">
        <h2 class="page-title">Grade Tracker</h2>
        <button id="btn-add-grade" class="btn-primary">+ Add Grade</button>
      </div>
      <div id="grades-list" class="grades-container"></div>
    </section>

    <!-- Assignments Page -->
    <section id="page-assignments" class="page">
      <div class="page-header">
        <h2 class="page-title">Assignments Planner</h2>
        <button id="btn-add-assignment" class="btn-primary">+ Add Assignment</button>
      </div>
      <div id="assignments-list" class="assignments-container"></div>
    </section>

    <!-- Subjects Hub Page -->
    <section id="page-subjects" class="page">
      <div class="page-header">
        <h2 class="page-title">Subjects Hub</h2>
        <button id="btn-add-subject" class="btn-primary">+ Add Subject</button>
      </div>
      <div id="subjects-list" class="subjects-grid"></div>
      <!-- Notes panel (shown when a subject is selected) -->
      <div id="notes-panel" class="notes-panel hidden">
        <div class="notes-header">
          <button id="btn-back-subjects" class="btn-secondary">← Back</button>
          <h3 id="notes-subject-title"></h3>
          <button id="btn-add-note" class="btn-primary">+ Add Note</button>
        </div>
        <div id="notes-list" class="notes-list"></div>
      </div>
    </section>
  </main>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <h3 id="modal-title"></h3>
      <form id="modal-form"></form>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary" type="button">Cancel</button>
        <button id="modal-save" class="btn-primary" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
